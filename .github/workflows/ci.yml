name: CI
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
      - name: time() resolution
        run: julia --startup-file=no time_resolution.jl
      - name: Install Makie
        run: julia --startup-file=no --project=. -e "using Pkg; Pkg.instantiate()"
      - name: Stale camera repro
        run: julia --startup-file=no --project=. stale_camera.jl
